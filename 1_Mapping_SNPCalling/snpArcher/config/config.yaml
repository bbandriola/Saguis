##############################
# Variables you need to change
##############################

# General infos
samples: "/labgenomaarea/saguis-lucero/1_Mapping_SNPCalling/config/samples_saguis.csv" # path to the sample metadata CSV
final_prefix: "Callit" # prefix for final output files
remote_reads: False # Set True if reads are in a location seperate from --default-remote-prefix.
remote_reads_prefix: "" # set to google bucket prefix where reads live. FOR SNAKEMAKE 7.X.X ONLY.
bigtmp: "/labgenomaarea/saguis-lucero/1_Mapping_SNPCalling/snpArcher_tmp/" #Set to a path with lots of free space to use for commands that require large amounts of temp space; defaults to system tmpdir if empty
generate_trackhub: True #Set to true if you want to generate a Genome Browser Trackhub. Dependent on postprocessing module.
trackhub_email: ""

# Set reference genome here if you would like to you use the same reference genome for all samples in sample sheet. See docs for more info.
reference:
  name: "Cjacchus"
  source: "/labgenomaarea/saguis-lucero/1_Mapping_SNPCalling/RefGenome/GCF_049354715.1_calJac240_pri/GCF_049354715.1_calJac240_pri_genomic.fna"

# reads
reads:
  mark_duplicates: true

# variant calling section with gatk which will use HaplotypeCaller ("produces gVCFs (genomic VCFs), which record genotype likelihoods at every position in the genome, not just variant sites")
variant_calling:
  expected_coverage: "low"
  tool: "gatk"
  ploidy: 2
  gatk:
    het_prior: 0.005 # because the mtDNA https://link.springer.com/article/10.1007/s10329-014-0418-2 showed pi=0.02-0.0035 

# parallelization - the interval approach speeds up the haplotype caller 
intervals:
  enabled: true
  min_nmer: 1000 # "A higher value (e.g., 500-1000) splits only at major gaps, producing fewer, larger intervals appropriate for chromosome-level assemblies."
  num_gvcf_intervals: 50
  db_scatter_factor: 0.15

# Hard filtering
callable_sites:
  generate_bed_file: true
  coverage:
    enabled: true
    fraction: 1.0
# coverage options (> 10x)
    min_coverage: auto # "auto" computes the threshold from the depth distribution.
    max_coverage: auto # "auto" computes the threshold from the depth distribution.
    merge_distance: 100
## callable sites bed file options ##
  mappability:
    enabled: true
    kmer: 150
    min_score: 1
#this ignores small regions of abberatant coverage/mappability as often these are just below the threshold
#to do strict filtering, set to 0
    merge_distance: 100

# modules
modules:
  qc:
    enabled: true
    clusters: 3
    min_depth: 5
    exclude_scaffolds: "NC_025586.1"
  postprocess:
    enabled: false
    filtering:
      contig_size: 10000
      maf: 0.01
      missingness: 1
      exclude_scaffolds: "NC_025586.1"

## Coverage options ##
## default pipeline is optimized for low coverage data - if using high coverage data (> 10x), uncomment high coverage options and comment out low coverage options

# low coverage options (< 10x)
#minP: 1
#minD: 1

# high coverage options (> 10x)
#minP: 2
#minD: 4


## Filtering options ##

#contig_size: 10000 # snps on contigs this size or smaller will be filtered from the final clean vcfs. Set to 0 to disable.
#maf: 0.01 #snps with MAF below this value will be filtered from the final clean vcfs. Set to 0 to disable.
#missingness: 1 #snps with missingness greater than this value will be filtered from the final clean vcfs. Set to 1 to disable.
#scaffolds_to_exclude: "mtDNA,Y" #comma separated, no spaces list of scaffolds to exclude from final clean vcfs. Set to blank to disable.

########################################
## coverage thresholds ##
########################################

## If cov_filter is True, use these parameters to control how coverage filtering is done
## Three options are provided for coverage-based filtering. The default option is to just filter
## regions of the genome with mean coverage below a minimal threshold (default = 1), with a very large upper limit
## To use this option, set the variables below to the lower absolute mean coverage limit and upper absolute mean coverage limit, 
## and make sure all other coverage variables are empty

#cov_threshold_lower: 
#cov_threshold_upper: 
 
## Alternatively, filtering can be done based on standard deviations 
## (assumes a Poisson distribution, so stdev_cov equals the square root of the mean coverage),
## where regions of the genome with mean coverage < X standard deviations or > X standard deviations are removed.
## To use this option, set the variables below to the desired X
## and make sure all other coverage variables are empty

#cov_threshold_stdev: 3 

## Finally, filtering can be done based on absolute scaling of the mean, 
## where regions of the genome with mean coverage < (global mean coverge / X) or > (global mean coverge * X) are removed.
## To use this option, set the variable below to the desired X
## and make sure all other coverage variables are empty

#cov_threshold_rel: 
